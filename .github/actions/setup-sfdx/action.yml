name: "Setup SFDX + Auth (JWT)"
description: "Node, Salesforce CLI, sfdx-git-delta, and JWT login."

inputs:
  client-id: { required: true }
  jwt-key: { required: true }
  username: { required: true }
  instance-url: { required: true }
  alias: { default: "targetOrg" }

runs:
  using: "composite"
  steps:
    # Node 22 for the hosted runner (sf needs 22+). Harmless in a container image.
    - uses: actions/setup-node@v4
      with: { node-version: "22" }
    - shell: bash
      run: |
        # Skip the install when sf is already present (e.g. the container image).
        if ! command -v sf >/dev/null 2>&1; then
          npm install --global @salesforce/cli@latest
        fi
        echo "y" | sf plugins install sfdx-git-delta
    - shell: bash
      env:
        JWT_KEY: ${{ inputs.jwt-key }}
      run: |
        echo "$JWT_KEY" > "${RUNNER_TEMP}/server.key"
        sf org login jwt \
          --client-id "${{ inputs.client-id }}" \
          --jwt-key-file "${RUNNER_TEMP}/server.key" \
          --username "${{ inputs.username }}" \
          --instance-url "${{ inputs.instance-url }}" \
          --alias "${{ inputs.alias }}" --set-default
        rm -f "${RUNNER_TEMP}/server.key"

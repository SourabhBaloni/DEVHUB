<template>
    <lightning-card title="Employee Parent">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Employee Name"
                value={empName}
                onchange={handleNameChange}>
            </lightning-input>

            <p class="slds-m-top_small">
                Parent Value: {employee.name}
            </p>

            <!-- Pass data Parent -> Child -->
            <c-employee-child employee-name={empName} employee-dept={employee.dir.name}> </c-employee-child>

            <lightning-button
                class="slds-m-top_medium"
                label="Call Child Method"
                onclick={handleCallChild}>
            </lightning-button>

        </div>

    </lightning-card>
</template>
